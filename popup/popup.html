<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Y2K-ifier</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body style="width: 220px;">
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">Y2K-ifier.exe</div>
        </div>
        <div class="content">
            <div class="control-group">
                <input type="checkbox" id="retroToggle" aria-label="复古模式开关">
                <label for="retroToggle">复古模式</label>
                <span class="toggle-state" id="retroState" aria-live="polite">开</span>
            </div>
            <div class="control-group">
                <input type="checkbox" id="crtToggle" aria-label="CRT 效果开关">
                <label for="crtToggle">CRT 扫描线</label>
                <span class="toggle-state" id="crtState" aria-live="polite">开</span>
            </div>
            
            <div class="footer">
                Version 1.0 (C) 2026 RetroSoft
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
